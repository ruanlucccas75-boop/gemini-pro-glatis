name: CI & Windows App Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  validate:
    name: Validate & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Latest LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Typecheck & Lint
        run: npm run lint

      - name: Build Web Application
        run: npm run build
        env:
          NODE_ENV: production

  build-windows-exe:
    name: Build Windows .EXE App
    runs-on: windows-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Latest LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windows .EXE (Electron Builder)
        run: npm run electron:build:win
        env:
          NODE_ENV: production
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Executable (.EXE)
        uses: actions/upload-artifact@v4
        with:
          name: Gemini-Windows-EXE-Installer
          path: dist-electron/*.exe
          retention-days: 14
