name: CI & Windows App Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-web:
    name: Build Web Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Latest LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck & Lint
        run: npm run lint

      - name: Build Application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload Compiled Dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 1

  package-windows-exe:
    name: Package Windows .EXE
    runs-on: windows-latest
    needs: build-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Latest LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Compiled Web Dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Install Runtime Dependencies and Builder
        run: |
          npm install --omit=dev
          npm install --no-save electron electron-builder

      - name: Package Windows Executable (.exe)
        run: npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Executable (.EXE)
        uses: actions/upload-artifact@v4
        with:
          name: Gemini-Windows-EXE-Installer
          path: dist-electron/*.exe
          retention-days: 14
