name: CI Build and Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Latest LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Typecheck & Lint
        run: npm run lint

      - name: Build Application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Archive Built Application (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: gemini-app-dist
          path: |
            dist/
            public/
            package.json
            package-lock.json
            .env.example
            start.bat
            start.sh
            README.md
          retention-days: 14
